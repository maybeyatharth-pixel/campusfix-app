<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="CampusFix - Mobile-First Campus Problem Reporting & Facilities Resolution Platform" />
  <title>CampusFix - Campus Problem Reporting</title>
  
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>" />
</head>
<body>

  <!-- Top Controls Bar (Visible on Desktop / Tablet for quick view & role switching) -->
  <header class="view-control-bar">
    <div class="view-control-left">
      <div class="campusfix-brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>CampusFix</span>
      </div>

      <button type="button" class="view-toggle-btn" id="view-toggle-btn" title="Toggle between mobile phone mockup and full responsive layout">
        <span>💻</span>
        <span>Switch to Expanded View</span>
      </button>
    </div>

    <div class="view-control-right">
      <!-- Role Switcher: Student ↔ Admin -->
      <div class="role-switch-pill">
        <button type="button" class="role-pill-btn active" id="role-pill-student">
          👤 Student Mode
        </button>
        <button type="button" class="role-pill-btn" id="role-pill-admin">
          🛠️ Admin Portal
        </button>
      </div>

      <!-- Theme Switch Icon Button -->
      <button type="button" class="icon-button" id="header-theme-toggle" title="Toggle Dark/Light Mode">
        <span id="theme-toggle-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <!-- Mobile Viewport / Frame Container -->
  <div class="phone-frame-wrapper" id="phone-frame-wrapper">
    <div class="app-container" id="app-container">

      <!-- Simulated Phone Status Bar -->
      <div class="phone-status-bar">
        <span>9:41</span>
        <div class="dynamic-island">
          <div class="island-camera"></div>
          <div class="island-sensor"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 0.72rem;">
          <span>5G</span>
          <span>100%</span>
        </div>
      </div>

      <!-- App Header -->
      <div class="app-header">
        <div class="header-title-wrap">
          <div class="header-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </div>
          <div>
            <div style="display: flex; align-items: center;">
              <span class="header-app-name">CampusFix</span>
              <span class="header-sub-badge">v1.2</span>
            </div>
            <div style="font-size: 0.68rem; color: var(--text-muted); font-weight: 500;">National Campus Network</div>
          </div>
        </div>

        <div class="header-actions">
          <button type="button" class="icon-button" id="header-notif-btn" title="Live Campus Alert Status">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Main Scrollable App Content Area -->
      <main class="app-content" id="app-content">
        <!-- TAB 1: HOME -->
        <section id="tab-home" class="tab-panel active"></section>

        <!-- TAB 2: REPORT -->
        <section id="tab-report" class="tab-panel"></section>

        <!-- TAB 3: TRACK -->
        <section id="tab-track" class="tab-panel"></section>

        <!-- TAB 4: HELP -->
        <section id="tab-help" class="tab-panel"></section>

        <!-- TAB 5: PROFILE -->
        <section id="tab-profile" class="tab-panel"></section>

        <!-- TAB 6: ADMIN DASHBOARD -->
        <section id="tab-admin" class="tab-panel"></section>
      </main>

      <!-- Bottom Tabs Navigation Bar -->
      <nav class="bottom-nav" id="bottom-nav">
        <!-- 1. Home -->
        <button type="button" class="nav-tab-btn active" data-tab="home">
          <div class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </div>
          <span class="nav-tab-label">Home</span>
        </button>

        <!-- 2. Track -->
        <button type="button" class="nav-tab-btn" data-tab="track">
          <div class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="nav-badge-dot"></span>
          </div>
          <span class="nav-tab-label">Track</span>
        </button>

        <!-- 3. Report (Center Action) -->
        <button type="button" class="nav-tab-btn report-tab-btn" data-tab="report">
          <div class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <span class="nav-tab-label" style="font-weight: 700; color: var(--primary);">Report</span>
        </button>

        <!-- 4. Help -->
        <button type="button" class="nav-tab-btn" data-tab="help">
          <div class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
          <span class="nav-tab-label">Help</span>
        </button>

        <!-- 5. Profile -->
        <button type="button" class="nav-tab-btn" data-tab="profile">
          <div class="nav-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <span class="nav-tab-label">Profile</span>
        </button>
      </nav>

    </div>
  </div>

  <!-- Detail & Status Timeline Bottom Sheet Modal -->
  <div class="modal-overlay" id="detail-modal-overlay"></div>

  <!-- Admin Status Update Bottom Sheet Modal -->
  <div class="modal-overlay" id="admin-modal-overlay"></div>

  <!-- Toast Notification Stack -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
